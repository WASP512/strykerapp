name: Release APK

# Publishes a downloadable APK to the repository's Releases page.
#
# How to cut a release:
#   1. Bump versionCode / versionName in app/build.gradle.
#   2. Tag the commit and push the tag, e.g.
#        git tag v6.0.1
#        git push origin v6.0.1
#   3. This workflow builds the APK and attaches it to a new GitHub Release
#      named after the tag.
#
# You can also trigger it by hand from the Actions tab (workflow_dispatch),
# supplying a tag name — useful for re-running or for an off-cycle build.
#
# Signing (optional but recommended so the APK installs without "unsigned"
# warnings): add these repository secrets and the release APK is signed
# automatically. Without them the workflow falls back to a debug-signed APK
# so there is always an installable download.
#   KEYSTORE_BASE64            base64 of your .jks  (base64 -w0 keystore.jks)
#   STRYKER_RELEASE_STORE_PASSWORD
#   STRYKER_RELEASE_KEY_ALIAS
#   STRYKER_RELEASE_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v6.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STRYKER_RELEASE_STORE_PASSWORD: ${{ secrets.STRYKER_RELEASE_STORE_PASSWORD }}
      STRYKER_RELEASE_KEY_ALIAS: ${{ secrets.STRYKER_RELEASE_KEY_ALIAS }}
      STRYKER_RELEASE_KEY_PASSWORD: ${{ secrets.STRYKER_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install SDK platform, build-tools, NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-33" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        id: build_release
        if: env.KEYSTORE_BASE64 != ''
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PSTRYKER_RELEASE_STORE_FILE="${{ steps.keystore.outputs.path }}"
          echo "apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK (no signing secrets configured)
        id: build_debug
        if: env.KEYSTORE_BASE64 == ''
        run: |
          ./gradlew assembleDebug --stacktrace
          echo "apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Stage APK for upload
        id: stage
        run: |
          SRC="${{ steps.build_release.outputs.apk || steps.build_debug.outputs.apk }}"
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          OUT="StrykerOSS-${RELEASE_TAG}.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "Staged $SRC -> $OUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: StrykerOSS ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.stage.outputs.apk }}
